# Render Blueprint for FairLens Full-Stack Deployment
services:
  - type: web
    name: fairlens-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: fairlens-36622
